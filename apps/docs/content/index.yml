title: Build your documentation with Nuxt.
description: Write guides in Markdown and organize them in your app. Use Indocio for navigation, search, and layouts built with IPEX and Akaza UI.
links:
  - label: Get started
    to: /getting-started/introduction
  - label: Explore configuration
    to: /getting-started/configuration
featuresTitle: Write, organize, and customize your docs.
features:
  - title: Keep your content in your app.
    description: Write Markdown, set your page order, and configure your landing page in one content folder.
    code: |
      apps/docs/content/
        index.yml
        getting-started/
          introduction.md
          configuration.md
  - title: Add Indocio to your Nuxt app.
    description: Add Indocio to your Nuxt configuration. Replace components and layouts with matching files in your app.
    code: |
      export default defineNuxtConfig({
        extends: ['@igrislabs/indocio'],
      })
  - title: Translate your documentation.
    description: Enable i18n when you need it. Keep each translation in its own content folder.
    code: |
      content/
        en/index.yml
        cn/index.yml
        fr/index.yml
  - title: Use IPEX components.
    description: Build with IPEX components in light and dark mode. Use Akaza UI for keyboard controls and accessibility.
    code: |
      <UiButton>Get started</UiButton>
      <UiTabs :items="items" />
  - title: Add components to Markdown.
    description: Write headings and code blocks, then add callouts or Vue components in the same document.
    code: |
      ::note{title="A useful detail"}
      Write the detail in Markdown.
      ::
preview:
  title: Preview a documentation page.
  description: Read the introduction below, then open the guide or check the configuration.
  to: /getting-started/introduction
